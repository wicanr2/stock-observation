name: 監控儀表板（GitHub Pages）

# 觸發時機：
#   1. 每日監控 workflow 完成後：以最新 commit 的 monitor/data/dashboard.json 重新部署。
#   2. 盤中每 30 分鐘：另抓 Yahoo 盤中報價、最新新聞標題與櫃買三大法人（不 commit，只部署）。
#   3. 修改網頁檔案或手動執行。
# 首次使用前：Settings → Pages → Build and deployment → Source 選「GitHub Actions」。

on:
  workflow_run:
    workflows: ['每日監控（BB、NOK、中光電投控）']
    types: [completed]
  schedule:
    # UTC 01–07 時＝台北 09–15 時（台股盤中與盤後三大法人公布）
    - cron: '7,37 1-7 * * 1-5'
    # UTC 13–21 時＝台北 21–05 時（美股盤中，涵蓋夏令與冬令時間）
    - cron: '7,37 13-21 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'monitor/web/**'
      - 'monitor/site.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run 觸發時取預設分支最新內容（包含每日監控剛 commit 的資料）
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: monitor/requirements.txt

      - name: 安裝依賴
        run: pip install -r monitor/requirements.txt

      - name: 建置儀表板（含盤中報價與最新新聞）
        run: python -m monitor site --out _site --live

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
